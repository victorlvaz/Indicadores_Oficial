# Streamlit Cloud: Settings > Secrets (cole este bloco). Local: .streamlit/secrets.toml (NÃO suba este arquivo ao GitHub).
[feishu]
app_id     = "cli_xxxxxxxxxxxx"          # Feishu Open Platform > seu app > Credenciais
app_secret = "xxxxxxxxxxxxxxxxxxxx"
chat_id    = "oc_xxxxxxxxxxxxxxxxxxxx"   # id do grupo de transportes (o app/bot precisa estar no grupo)
dominio    = "https://open.feishu.cn"    # Lark internacional: "https://open.larksuite.com"
senha      = "troque-esta-senha"         # opcional: quem clicar em enviar precisa digitar
