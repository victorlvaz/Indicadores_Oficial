<svg width="1288" height="528" viewBox="-14 -14 1288 528" role="img" aria-label="O arquivo do JMS, TECHIS ou das planilhas de frete entra pelo upload depois do login, passa pelas regras, vai para o histórico e alimenta os relatórios, que saem na tela, no Excel e no bot do Feishu." xmlns="http://www.w3.org/2000/svg">
